<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0A0814; }
      #unity-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: #0A0814; outline: none; }
      #unity-loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
        font: 600 clamp(16px, 3.2vw, 28px)/1.2 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: .08em; color: #8C8C96; }
      #unity-loading-bar { width: min(60vw, 420px); height: 6px; border-radius: 3px; background: #24203A; overflow: hidden; }
      #unity-progress-bar-full { width: 0%; height: 100%; background: linear-gradient(90deg, #FFD65A, #EC40AA, #6ED6F5); transition: width .15s; }
      #unity-error { display: none; max-width: 80vw; color: #EC40AA; font-size: 14px; letter-spacing: 0; text-align: center; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="unity-loading">
      <div>GRAY TO <span style="color:#E6E6EF">BRIGHT</span></div>
      <div id="unity-loading-bar"><div id="unity-progress-bar-full"></div></div>
      <div id="unity-error"></div>
    </div>
    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script>
      // Холст всегда заполняет окно (iframe itch.io или экран телефона) — размер задаётся на странице itch.
      var canvas = document.querySelector("#unity-canvas");
      var loading = document.querySelector("#unity-loading");
      var bar = document.querySelector("#unity-progress-bar-full");
      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: "Build/{{{ DATA_FILENAME }}}",
        frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
        workerUrl: "Build/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
        codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        // На телефонах с плотностью 3x рендер в 2x: картинка чёткая, а нагрузка на GPU заметно ниже.
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
      }, function (progress) {
        bar.style.width = (100 * progress) + "%";
      }).then(function () {
        loading.style.display = "none";
        canvas.focus();
      }).catch(function (message) {
        var error = document.querySelector("#unity-error");
        error.textContent = message;
        error.style.display = "block";
      });
      canvas.addEventListener("pointerdown", function () { canvas.focus(); });
    </script>
  </body>
</html>
